<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Поставки FBO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: рабочая панель логиста — шапка со сводкой по статусам, фильтры, плотная таблица с раскрытием состава */
:root{
  --bg:#f5f7f8; --surface:#ffffff; --fg:#14232b; --muted:#5d6d75; --line:#dbe2e5;
  --accent:#0b6e75; --accent-soft:#e0f0f0;
  --st2:#5b6ea8; --st2-bg:#e8ecf7; --st3:#a76a07; --st3-bg:#fbf0db; --st4:#1d7a46; --st4-bg:#e2f3e9;
  --bad:#b3372b; --bad-bg:#fbe7e4;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --surface:#16222a; --fg:#e3ecef; --muted:#93a4ac; --line:#28363e;
  --accent:#4fc1c4; --accent-soft:#163a3d;
  --st2:#9eb0ea; --st2-bg:#232c48; --st3:#f0b54f; --st3-bg:#3b2d12; --st4:#5fd08f; --st4-bg:#173826;
  --bad:#ff8a7b; --bad-bg:#43211c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --surface:#16222a; --fg:#e3ecef; --muted:#93a4ac; --line:#28363e;
  --accent:#4fc1c4; --accent-soft:#163a3d;
  --st2:#9eb0ea; --st2-bg:#232c48; --st3:#f0b54f; --st3-bg:#3b2d12; --st4:#5fd08f; --st4-bg:#173826;
  --bad:#ff8a7b; --bad-bg:#43211c; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.upd{color:var(--muted);font-size:13px}
.upd b{font-family:var(--f-mono);font-weight:500;color:var(--fg)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{appearance:none;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;border-left:4px solid var(--c,var(--accent))}
.stat[aria-pressed="true"]{background:var(--cb,var(--accent-soft))}
.stat:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat .big{font-size:22px;font-weight:600}
.stat .sub{font-size:12px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:none;font:inherit;color:var(--muted);padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:500}
select,input[type=search]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 10px;min-width:0}
input[type=search]{flex:1 1 200px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{appearance:none;border:0;background:none;font:inherit;font-weight:500;color:var(--muted);padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;white-space:normal;overflow-wrap:anywhere}
td.num,td.r,th.r{white-space:nowrap;overflow-wrap:normal}
th{overflow-wrap:normal;word-break:normal}
table.art{width:100%;min-width:0}
table.art th,table.art td{padding:4px 5px}
table.art th.wh{white-space:normal;width:52px;min-width:44px;max-width:64px;font-size:11px;line-height:1.2;letter-spacing:.02em;vertical-align:bottom;word-break:break-word;hyphens:auto}
th{font-size:11px;line-height:1.25;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--surface);position:sticky;top:0;cursor:pointer;user-select:none}
th.r,td.r{text-align:right}
th .ar{opacity:.6;margin-left:3px}
tbody tr.row{cursor:pointer}
select.ffsel{padding:2px 6px;font-size:13px;max-width:190px}
select.ffsel.empty{color:var(--muted)}
select.ffsel.saving{opacity:.55}
tbody tr.row:hover td{background:var(--accent-soft)}
tr.goods td{background:var(--bg);white-space:normal;padding:10px 14px 14px}
tr.goods table{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px}
tr.goods th{position:static;cursor:default}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;color:var(--c);background:var(--cb)}
.s2{--c:var(--st2);--cb:var(--st2-bg)} .s3{--c:var(--st3);--cb:var(--st3-bg)} .s4{--c:var(--st4);--cb:var(--st4-bg)}
.flag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:600;color:var(--bad);background:var(--bad-bg)}
.diff-pos{color:var(--st4)} .warn{color:var(--st3)} .diff-neg{color:var(--bad)}
.muted{color:var(--muted)}
.btn2{background:var(--surface);color:var(--accent);border:1px solid var(--accent)!important}
.btn{appearance:none;font:inherit;font-weight:500;color:var(--surface);background:var(--accent);border:0;border-radius:7px;padding:7px 14px;cursor:pointer}
h2.sec{font-size:15px;font-weight:600;margin:6px 0 8px}
.tabs{flex-wrap:wrap}
table.art th .src{font-size:10px;font-weight:600;color:var(--accent);letter-spacing:.04em}
td.real{background:var(--accent-soft)}
td.fbs{font-style:italic;color:var(--muted)}
td.zero{color:var(--bad);font-weight:600}
.chip{appearance:none;font:inherit;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.cab{font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tot td{font-weight:600;background:var(--bg)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 14px}
.note{color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Поставки FBO и остатки на ФФ</h1>
    <div class="upd" id="updBox">Данные WB на <b id="upd">—</b> МСК</div>
  </header>
  <div id="errs" hidden class="err"></div>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <div class="seg" id="cabSeg" role="group" aria-label="Кабинет"></div>
    <select id="wh" aria-label="Склад WB"><option value="">Все склады</option></select>
    <input id="q" type="search" placeholder="Номер поставки, ФФ, артикул, баркод" aria-label="Поиск">
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-sup" aria-selected="true">Поставки</button>
    <button role="tab" id="t-wh" aria-selected="false">По складам</button>
    <button role="tab" id="t-art" aria-selected="false">По артикулам</button>
    <button role="tab" id="t-stk" aria-selected="false">Остатки на ФФ</button>
    <button role="tab" id="t-sum" aria-selected="false">Сводка</button>
    <button role="tab" id="t-cmp" aria-selected="false">Комплектующие</button>
  </div>
  <div id="view"></div>
  <div class="note" id="noteSup" hidden></div>
  <div class="note" id="noteStk" hidden></div>
</div>

<script>
const ST={2:'Запланировано',3:'Отгрузка разрешена',4:'Идёт приёмка'};
const S={cab:'',st:null,wh:'',q:'',tab:'sup',brands:new Set(),sort:{k:'planned',d:1},open:new Set()};
let D={supplies:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtN=n=>(n??0).toLocaleString('ru-RU');
const WD=['вс','пн','вт','ср','чт','пт','сб'];
function d0(s){return s?new Date(s.slice(0,10)+'T00:00:00'):null}
function fD(s,wd){if(!s)return'—';const d=d0(s);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+(wd?' '+WD[d.getDay()]:'')}
function fDT(s){if(!s)return'—';return fD(s)+' '+s.slice(11,16)}
const today=(()=>{const n=new Date(Date.now()+ (new Date().getTimezoneOffset()+180)*60000);return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();
function key(s){return s.id?String(s.id):'p'+s.preorderID}

try{const v=localStorage.getItem('fbo-tab');if(v)S.tab=v}catch(e){}

function filtered(useStatus=true){
  const q=S.q.trim().toLowerCase();
  return D.supplies.filter(s=>(!S.cab||s.cab===S.cab)&&(!S.wh||s.warehouse===S.wh)&&(!useStatus||S.st==null||s.status===S.st)&&
    (!q||(s.ff||'').toLowerCase().includes(q)||String(s.id||'').includes(q)||String(s.preorderID||'').includes(q)||s.goods.some(g=>(g.article||'').toLowerCase().includes(q)||(g.barcode||'').includes(q))));
}

function renderStats(){
  const base=filtered(false);
  const all={n:base.length,u:base.reduce((a,s)=>a+s.qty,0)};
  let h=`<button class="stat" style="--c:var(--accent)" aria-pressed="${S.st==null}" data-st=""><span class="lbl">Все в работе</span><span class="big num">${fmtN(all.n)}</span><span class="sub"><span class="num">${fmtN(all.u)}</span> шт.</span></button>`;
  for(const k of [2,3,4]){const l=base.filter(s=>s.status==k);const u=l.reduce((a,s)=>a+s.qty,0);
    h+=`<button class="stat s${k}" aria-pressed="${S.st==k}" data-st="${k}"><span class="lbl">${ST[k]}</span><span class="big num">${fmtN(l.length)}</span><span class="sub"><span class="num">${fmtN(u)}</span> шт.</span></button>`}
  $('stats').innerHTML=h;
  $('stats').querySelectorAll('.stat').forEach(b=>b.onclick=()=>{S.st=b.dataset.st===''?null:+b.dataset.st;render()});
}

function renderCab(){
  const cabs=[['','Оба кабинета'],['erokl','Ероклинцев'],['avanti','Аванти']];
  $('cabSeg').innerHTML=cabs.map(([v,l])=>`<button aria-pressed="${S.cab===v}" data-v="${v}">${l}</button>`).join('');
  $('cabSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.cab=b.dataset.v;render()});
  const whs=[...new Set(D.supplies.filter(s=>!S.cab||s.cab===S.cab).map(s=>s.warehouse))].sort((a,b)=>a.localeCompare(b,'ru'));
  if(S.wh&&!whs.includes(S.wh))S.wh='';
  $('wh').innerHTML='<option value="">Все склады</option>'+whs.map(w=>`<option${w===S.wh?' selected':''}>${esc(w)}</option>`).join('');
}

function acceptCell(s){
  if(s.status!==4)return'<span class="muted">—</span>';
  const d=s.accepted-s.qty;
  return `<span class="num">${fmtN(s.accepted)}</span>`+(d?` <span class="num ${d>0?'diff-pos':'diff-neg'}">(${d>0?'+':''}${fmtN(d)})</span>`:'');
}

function goodsTable(s){
  const acc=s.status===4;
  const rows=[...s.goods].sort((a,b)=>(a.article||'').localeCompare(b.article||'','ru',{numeric:true}));
  return `<table><thead><tr><th>Артикул</th><th>Баркод</th><th>Цвет</th><th class="r">Заявлено</th>${acc?'<th class="r">Принято</th><th class="r">Разница</th>':''}</tr></thead><tbody>`+
   rows.map(g=>{const d=g.accepted-g.qty;return `<tr><td>${esc(g.article)}</td><td class="num">${esc(g.barcode)}</td><td>${esc(g.color||'')}</td><td class="r num">${fmtN(g.qty)}</td>${acc?`<td class="r num">${fmtN(g.accepted)}</td><td class="r num ${d>0?'diff-pos':d<0?'diff-neg':'muted'}">${d?(d>0?'+':'')+fmtN(d):'—'}</td>`:''}</tr>`}).join('')+
   `</tbody></table>`+(s.acceptanceCost>0?`<div class="note" style="margin-top:6px">Стоимость приёмки: <span class="num">${fmtN(s.acceptanceCost)}</span> ₽</div>`:'');
}

const COLS=[['id','№ поставки'],['cab','Кабинет'],['warehouse','Склад WB'],['ff','ФФ'],['box','Тип'],['status','Статус'],['planned','Плановая дата'],['qty','Кол-во','r'],['accepted','Принято','r']];
function renderSup(){
  const l=filtered();
  const {k,d}=S.sort;
  l.sort((a,b)=>{let x=a[k],y=b[k];if(k==='id'){x=a.id||0;y=b.id||0}
    if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
    return (typeof x==='number'?x-y:String(x).localeCompare(String(y),'ru'))*d});
  if(!l.length){$('view').innerHTML='<div class="tbl"><div class="empty">Поставок по этим фильтрам нет.</div></div>';return}
  const tot=l.reduce((a,s)=>a+s.qty,0);
  let h='<div class="tbl"><table><thead><tr>'+COLS.map(([c,n,r])=>`<th class="${r||''}" data-k="${c}">${n}${k===c?`<span class="ar">${d>0?'▲':'▼'}</span>`:''}</th>`).join('')+'</tr></thead><tbody>';
  for(const s of l){const kk=key(s);
    h+=`<tr class="row" data-key="${kk}" tabindex="0" aria-expanded="${S.open.has(kk)}"><td class="num">${s.id?s.id:'<span class="muted">заказ '+s.preorderID+'</span>'}</td><td class="cab">${esc(s.cabName)}</td><td>${esc(s.warehouse)}${s.transit?`<div class="cab">транзит: ${esc(s.transit)}</div>`:''}</td><td>${s.id?ffSelect(s):(s.ff?esc(s.ff):'<span class="muted">—</span>')}</td><td>${esc(s.box)}</td><td><span class="pill s${s.status}">${ST[s.status]}</span></td><td class="num">${fD(s.planned,true)}</td><td class="r num">${fmtN(s.qty)}</td><td class="r">${acceptCell(s)}</td></tr>`;
    if(S.open.has(kk))h+=`<tr class="goods"><td colspan="${COLS.length}">${goodsTable(s)}</td></tr>`}
  h+=`<tr class="tot"><td colspan="7">Итого: ${l.length} ${pl(l.length,'поставка','поставки','поставок')}</td><td class="r num">${fmtN(tot)}</td><td></td></tr></tbody></table></div>`;
  $('view').innerHTML=h;
  $('view').querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const c=th.dataset.k;S.sort=S.sort.k===c?{k:c,d:-S.sort.d}:{k:c,d:1};render()});
  $('view').querySelectorAll('tr.row').forEach(tr=>{const t=()=>{const kk=tr.dataset.key;S.open.has(kk)?S.open.delete(kk):S.open.add(kk);render()};tr.onclick=t;tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}}});
  $('view').querySelectorAll('select.ffsel').forEach(sel=>{sel.onclick=e=>e.stopPropagation();sel.onkeydown=e=>e.stopPropagation();sel.onchange=()=>changeFF(sel)});
}
// ---- ФФ поставки: выбор на сайте, сохраняется в docs/ff_map.json через GitHub ----
const REPO='eroclincev-hue/statusostatki2026',FFMAP='docs/ff_map.json';
let FFM={};
function ffOptions(){const s=new Set([...FF_ORDER,'ФФ Краснодар','ФФ Казань']);(D?D.supplies:[]).forEach(x=>x.ff&&s.add(x.ff));Object.values(FFM).forEach(v=>v&&s.add(v));return [...s]}
function ffSelect(s){const cur=s.ff||'';const o=ffOptions();if(cur&&!o.includes(cur))o.push(cur);
  return `<select class="ffsel${cur?'':' empty'}" data-id="${s.id}" aria-label="ФФ поставки ${s.id}"><option value="">— не указан —</option>${o.map(f=>`<option${f===cur?' selected':''}>${esc(f)}</option>`).join('')}<option value="__new">Другой ФФ…</option></select>`}
function applyFFM(){if(!D)return;D.supplies.forEach(s=>{if(s.id&&Object.prototype.hasOwnProperty.call(FFM,String(s.id)))s.ff=FFM[String(s.id)]})}
function ghToken(ask){let t='';try{t=localStorage.getItem('gh-token')||''}catch(e){}
  if(!t&&ask){t=(prompt('Чтобы выбор ФФ сохранился для всех, вставьте ключ GitHub (fine-grained token с доступом Contents: Read and write к репозиторию statusostatki2026). Он запомнится только в этом браузере.')||'').trim();if(t)try{localStorage.setItem('gh-token',t)}catch(e){}}
  return t}
const b64e=s=>btoa(unescape(encodeURIComponent(s))),b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function ghGet(t){const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${FFMAP}?ref=main&t=${Date.now()}`,{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'},cache:'no-store'});
  if(r.status===401||r.status===403){try{localStorage.removeItem('gh-token')}catch(e){}throw new Error('ключ GitHub не подошёл')}
  if(r.status===404)return {map:{},sha:null};if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();return {map:JSON.parse(b64d(j.content)||'{}'),sha:j.sha}}
async function saveFF(id,ff){const t=ghToken(true);if(!t)throw new Error('нет ключа GitHub');
  for(let i=0;i<3;i++){const {map,sha}=await ghGet(t);map[String(id)]=ff;
    const body={message:`ФФ поставки ${id}: ${ff||'не указан'}`,content:b64e(JSON.stringify(map,null,1)+'\n'),branch:'main'};if(sha)body.sha=sha;
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${FFMAP}`,{method:'PUT',headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'},body:JSON.stringify(body)});
    if(r.ok){FFM=map;return}
    if(r.status===401||r.status===403){try{localStorage.removeItem('gh-token')}catch(e){}throw new Error('ключ GitHub не подошёл или без права записи')}
    if(r.status!==409&&r.status!==422)throw new Error('GitHub '+r.status)}
  throw new Error('не получилось сохранить, попробуйте ещё раз')}
async function changeFF(sel){const id=+sel.dataset.id,s=D.supplies.find(x=>x.id===id);if(!s)return;const prev=s.ff||'';let ff=sel.value;
  if(ff==='__new'){ff=(prompt('Название ФФ:')||'').trim();if(!ff){sel.value=prev;return}}
  sel.classList.add('saving');sel.disabled=true;
  try{await saveFF(id,ff);s.ff=ff;render()}
  catch(e){alert('ФФ не сохранён: '+e.message);s.ff=prev;render()}}
function loadFFM(){const t=ghToken(false);
  const p=t?ghGet(t).then(x=>x.map).catch(()=>fetch('ff_map.json',{cache:'no-store'}).then(r=>r.json())):fetch('ff_map.json',{cache:'no-store'}).then(r=>r.json());
  return p.then(m=>{FFM=m||{}}).catch(()=>{})}
function pl(n,a,b,c){const m=n%100,m1=n%10;return m>10&&m<20?c:m1===1?a:m1>=2&&m1<=4?b:c}

function renderWh(){
  const l=filtered();const m=new Map();
  for(const s of l){const r=m.get(s.warehouse)||{w:s.warehouse,n:0,2:0,3:0,4:0,next:null};r.n++;r[s.status]+=s.qty;
    if(s.status!==4&&s.planned&&(!r.next||s.planned<r.next))r.next=s.planned;m.set(s.warehouse,r)}
  const rows=[...m.values()].sort((a,b)=>(b[2]+b[3]+b[4])-(a[2]+a[3]+a[4]));

function stockGroups(){
  const W={};K.warehouses.forEach(w=>W[w.id]=w);
  const REAL=K.real||{};

  for(const i of K.items){const k=i.article.toLowerCase();let g=G.get(k);
    if(!g){g={article:i.article,title:i.title,brand:i.brand,nm:[],bc:[],oz:[],cabs:new Set(),cabNames:new Set(),members:[],real:{},sold:0,fam:i.fam||null};G.set(k,g)}
    if(g.brand==='Без бренда'&&i.brand!=='Без бренда')g.brand=i.brand;
    if(i.nm)g.nm.push(i.nm);if(i.bc)g.bc.push(i.bc);if(i.oz)g.oz.push(i.oz);g.sold+=i.sold||0;if(i.fam)g.fam=i.fam;
    g.cabs.add(i.cab);g.cabNames.add(i.cabName.replace('ИП ',''));g.members.push(i);Object.assign(g.real,i.real||{})}

    for(const [ff,r] of Object.entries(g.real)){v[ff]=r.now;tip[ff]=r.fbo!=null?`Остаток по 1С (все артикулы семейства, в штучных): ${r.base}\nВ поставках FBO: −${r.fbo}\nЗаказов FBS с ${fD(new Date(new Date(REAL[ff].time).getTime()+3*3600e3).toISOString())}: −${r.orders}\nСейчас: ${r.now}`:REAL[ff].label==='приход'?`Приход: ${r.base}\nЗаказов FBS с ${fD(new Date(new Date(REAL[ff].time).getTime()+3*3600e3).toISOString())}: ${r.orders}\nСейчас: ${r.now}`:`Выгрузка ВМС, свободный: ${r.base}\nЗаказов FBS после выгрузки: ${r.orders}\nСейчас: ${r.now}`}
    const f={};for(const i of g.members)for(const [wid,a] of Object.entries(i.st)){const w=W[wid];if(!w||g.real[w.ff]||(REAL[w.ff]&&REAL[w.ff].exclusive))continue;(f[w.ff]=f[w.ff]||[]).push([(g.cabs.size>1?(w.cab==='avanti'?'Аванти · ':'Ероклинцев · '):'')+w.name,a,w.cab])}

      if(POOLED.has(ff)){const byCab={};l.forEach(x=>byCab[x[2]]=Math.max(byCab[x[2]]||0,x[1]));val=Object.values(byCab).reduce((a,b)=>a+b,0)}

      v[ff]=val;tip[ff]=(REAL[ff]&&!REAL[ff].fbs_ok?'Нет в выгрузке ВМС, показан остаток FBS из кабинета WB:\n':'Остатки FBS в кабинете WB:\n')+l.map(x=>x[0]+': '+x[1]).join('\n')}
    const t=Object.values(v).reduce((a,b)=>a+b,0);
    return {g,v,tip,t}});
}

let LAST_SUM=[],DL=null,DLP=null;

      `<td class="num">${x.oz.length?esc([...new Set(x.oz)].join(', ')):'<span class="muted">—</span>'}</td>`+
      `<td title="${esc(x.title)}">${esc(x.article)}${x.members>1?`<div class="cab">${famOf[x.k]?'все артикулы семейства':'вместе с дублем'}</div>`:''}${x.cabs.size>1?'<div class="cab">Ероклинцев + Аванти</div>':x.cabs.has('avanti')?'<div class="cab">Аванти</div>':''}</td>`+
      `<td class="cab">${esc(x.brand)}</td><td class="r num"><b>${fmtN(x.stock)}</b></td><td class="r num">${x.plan?fmtN(x.plan):'<span class="muted">—</span>'}</td><td class="r num"><b>${fmtN(x.stock+x.plan)}</b></td>`+
      `<td class="r num">${x.perDay?x.perDay.toLocaleString('ru-RU',{maximumFractionDigits:1}):'<span class="muted">—</span>'}</td>`+
      `<td class="r num ${tcls(x.turn)}">${x.turn==null?'—':x.turn===0?'0':x.turn<1?'&lt;1':fmtN(Math.round(x.turn))}</td></tr>`}
  h+=`<tr class="tot"><td colspan="5">Итого: ${rows.length} ${pl(rows.length,'артикул','артикула','артикулов')}</td><td class="r num">${fmtN(rows.reduce((a,x)=>a+x.stock,0))}</td><td class="r num">${fmtN(rows.reduce((a,x)=>a+x.plan,0))}</td><td class="r num">${fmtN(rows.reduce((a,x)=>a+x.stock+x.plan,0))}</td><td class="r num">${rows.reduce((a,x)=>a+x.perDay,0).toLocaleString('ru-RU',{maximumFractionDigits:0})}</td><td></td></tr></tbody></table></div>`;
  $('view').innerHTML=h;bind();
}

function renderCmp(){
  if(!K){$('view').innerHTML='<div class="tbl"><div class="empty">Загружаю…</div></div>';return}
  const q=S.q.trim().toLowerCase();
  const blocks=Object.entries(K.real||{}).filter(([ff,m])=>(m.components||[]).length).map(([ff,m])=>{
    const l=m.components.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.article||'').toLowerCase().includes(q));
    if(!l.length)return '';
    const when=fDT(new Date(new Date(m.time).getTime()+3*3600e3).toISOString());
    return `<h2 class="sec">${esc(ff)} <span class="muted">· выгрузка ВМС от ${when} МСК</span></h2><div class="tbl"><table class="art"><thead><tr><th>Комплектующее</th><th>Артикул</th><th class="r">Остаток</th><th class="r">Резерв</th><th class="r">Доступно</th></tr></thead><tbody>`+
      l.map(c=>`<tr><td style="white-space:normal;min-width:260px">${esc(c.name)}</td><td class="cab">${c.article?esc(c.article):'<span class="muted">—</span>'}</td><td class="r num">${fmtN(c.total)}</td><td class="r num">${c.reserve?fmtN(c.reserve):'<span class="muted">—</span>'}</td><td class="r num${c.free<0?' diff-neg':c.free===0?' muted':''}">${fmtN(c.free)}</td></tr>`).join('')+'</tbody></table></div>'}).join('');
  $('view').innerHTML=(blocks||'<div class="tbl"><div class="empty">Комплектующих нет.</div></div>');
}

function render(){
  renderCab();renderStats();
  const stk=S.tab==='stk'||S.tab==='sum'||S.tab==='cmp';
  $('stats').hidden=stk;$('wh').hidden=stk;$('noteSup').hidden=true;$('noteStk').hidden=true;
  $('q').placeholder=stk?'Артикул, название, артикул WB':'Номер поставки, ФФ, артикул, баркод';
  $('upd').textContent=(stk?K&&K.updated:D.updated)||'—';
  ['sup','wh','art','stk','sum','cmp'].forEach(t=>$('t-'+t).setAttribute('aria-selected',S.tab===t));
  ({sup:renderSup,wh:renderWh,art:renderArt,stk:renderStock,sum:renderSum,cmp:renderCmp})[S.tab]();
}
['sup','wh','art','stk','sum','cmp'].forEach(t=>$('t-'+t).onclick=()=>{S.tab=t;try{localStorage.setItem('fbo-tab',t)}catch(e){}render()});
$('wh').onchange=e=>{S.wh=e.target.value;render()};
$('q').oninput=e=>{S.q=e.target.value;render()};

Promise.all([fetch('data.json',{cache:'no-store'}).then(r=>r.json()),loadFFM()]).then(([d])=>{D=d;applyFFM();$('upd').textContent=d.updated;
  if(d.errors&&d.errors.length){$('errs').hidden=false;$('errs').textContent='Не всё загрузилось: '+d.errors.join('; ')}
  render()}).catch(()=>{$('view').innerHTML='<div class="tbl"><div class="empty">Не удалось загрузить данные. Обновите страницу.</div></div>'});
fetch('stocks.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{K=d;if(S.tab==='stk'||S.tab==='sum'||S.tab==='cmp')render()}).catch(()=>{K={warehouses:[],items:[],updated:'—'};if(S.tab==='stk'||S.tab==='sum'||S.tab==='cmp')render()});
render();
</script>
